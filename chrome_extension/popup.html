<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid #4CAF50;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }

        .status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .url-section {
            margin: 15px 0;
        }

        .url-display {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-size: 12px;
            min-height: 40px;
            border: 1px solid #ddd;
        }

        .url-display.empty {
            color: #999;
            font-style: italic;
        }

        .quality-section {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            background-color: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .download-btn {
            background-color: #4CAF50;
            color: white;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        .download-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .capture-btn {
            background-color: #2196F3;
            color: white;
        }

        .capture-btn:hover {
            background-color: #0b7dda;
        }

        .settings {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 8px;
            background-color: #e7f3ff;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎥 Video Downloader</h1>
    </div>

    <div id="status" class="status disconnected">
        🔴 App Not Connected
        <button id="refreshConnectionBtn" style="margin-left: 10px; padding: 5px 10px; cursor: pointer; border: none; background: white; border-radius: 3px; font-size: 12px;">🔄 Refresh</button>
    </div>

    <div class="url-section">
        <label>Current URL:</label>
        <div id="currentUrl" class="url-display empty">No video detected on this page</div>
    </div>

    <div class="quality-section">
        <label>Quality/Format:</label>
        <select id="qualitySelect">
            <option value="best">Best Quality</option>
            <option value="8k">8K (4320p)</option>
            <option value="4k">4K (2160p)</option>
            <option value="1440p">1440p (2K)</option>
            <option value="1080p">1080p (Full HD)</option>
            <option value="720p" selected>720p (HD)</option>
            <option value="480p">480p (SD)</option>
            <option value="360p">360p</option>
            <option value="audio">Audio Only (MP3)</option>
        </select>
    </div>

    <div class="button-group">
        <button id="captureBtn" class="capture-btn">📋 Capture URL</button>
        <button id="downloadBtn" class="download-btn" disabled>⬇️ Download</button>
    </div>

    <div class="settings">
        <div class="checkbox-group">
            <input type="checkbox" id="autoCapture">
            <label for="autoCapture">Auto-capture video URLs</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="autoDownload">
            <label for="autoDownload">Auto-download on capture</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="downloadPlaylist">
            <label for="downloadPlaylist">Download entire playlist</label>
        </div>
    </div>

    <div class="info">
        💡 Tip: Enable auto-capture to automatically detect videos on pages. Make sure the desktop app is running!
    </div>

    <script src="popup.js"></script>
</body>
</html>
